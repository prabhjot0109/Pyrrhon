[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyrrhon"
# Derived from `pyrrhon/__init__.py`, which is where the splash, the status bar
# and `--version` already read it. Two literals cannot disagree if there is only
# one, and the pair could disagree silently — nothing imports the pyproject
# value at runtime, so a release would have shipped one number on PyPI and
# printed another on screen.
dynamic = ["version"]
description = "A voice-first senior-engineer agent for understanding and designing software."
readme = "README.md"
# Upper bound, and it is load-bearing rather than cautious. `pipecat-ai[local]`
# pulls `pyaudio`, whose latest release (0.2.14) ships wheels for cp312 and
# cp313 and NOT cp314. Without the cap, pip happily selects Pyrrhon on 3.14 and
# then hands the user a C compiler error from a transitive dependency they
# never named — a failure that looks like our bug and cannot be fixed from
# here. The classifiers below already claimed only 3.12 and 3.13; this makes
# the resolver agree with them, since nothing resolves on a classifier.
# Lift it the release after pyaudio ships a cp314 wheel.
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Prabhjot Singh" }]
keywords = [
    "voice",
    "agent",
    "codebase",
    "llm",
    "terminal",
    "tui",
    "code-comprehension",
    "grounding",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Documentation",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
]

dependencies = [
    "ddgs>=9.14.4",
    "google-genai>=2.10.0",
    "html2text>=2025.4.15",
    "httpx>=0.28.1",
    "huggingface-hub>=1.22.0",
    "mcp>=1.10,<2",
    "openai>=2.44.0",
    # Every extra the voice table names, plus the audio stack itself. This is
    # one line rather than a `voice` extra on purpose: a provider you have to
    # run a second command to reach is not a provider Pyrrhon ships, and the
    # menu that offers it is lying. `install: uv add ...` in
    # config/catalog.py:availability() is now unreachable for a bundled row
    # and stays only for a plugin-supplied one.
    # tests/test_voice_registry.py::test_tier2_every_table_row_ships_installed
    # is what keeps this list in step with pyrrhon/voice/registry.py.
    # The cost is torch and torchaudio (local-smart-turn, on by default) plus
    # the on-device engines, which a text-only user now also pays for. That
    # is the deliberate trade: one `uv sync` reaches every row in the table.
    "pipecat-ai[assemblyai,cartesia,deepgram,elevenlabs,gladia,google,groq,inworld,kokoro,local,local-smart-turn,moonshine,openai,piper,rime,rnnoise,silero,whisper]>=1.7.0",
    "pydantic>=2.12.5",
    "pyyaml>=6.0.3",
    "rich>=14.3.1",
    "soundfile>=0.14.0",
    "textual>=8.2.8",
    "tomli-w>=1.2.0",
    # Pinned <0.26: tree-sitter 0.26.0 (2026-06-30) broke the C-ABI the
    # pre-compiled grammars in tree-sitter-language-pack are linked against,
    # segfaulting SymbolIndex.ensure_fresh. The pack only requires >=0.23, so
    # an unbounded pin silently resolves to the crashing core.
    "tree-sitter>=0.25.2,<0.26",
    "tree-sitter-language-pack>=1.12.2",
]

[project.scripts]
pyrrhon = "pyrrhon.cli:main"

# Rendered as the sidebar links on the PyPI project page. `Homepage` is what
# `pip show` reports, so it points at the repo rather than the marketing site:
# somebody reading `pip show` output wants the source.
[project.urls]
Homepage = "https://github.com/prabhjot0109/Pyrrhon"
Source = "https://github.com/prabhjot0109/Pyrrhon"
Issues = "https://github.com/prabhjot0109/Pyrrhon/issues"
Changelog = "https://github.com/prabhjot0109/Pyrrhon/releases"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "live: hits real provider APIs; needs keys. Excluded from CI. Run with -m live",
]
# Tier 3 is opt-in: `uv run pytest` must never reach the network or spend a
# provider quota. `-m live` overrides this on purpose.
addopts = "-m 'not live'"

[tool.hatch.version]
path = "pyrrhon/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pyrrhon"]

# The wheel is allowlisted above; the sdist is allowlisted here, for the same
# reason and not merely for symmetry.
#
# This was an `exclude` list, and a denylist is the wrong shape for a step whose
# failure mode is public and permanent: a release cannot be re-uploaded under
# the same version, so anything that leaks is on the index for good. It named
# web/, evals/, .github/, .pyrrhon/ and .claude/ — and by the time anyone
# looked, three top-level directories had appeared that it did not name, so the
# tarball carried 70 files of .remember/ session memory, 43 of .superpowers/
# (including three review diffs over 140 KB each), 31 internal planning docs
# and CLAUDE.md. A denylist fails open. An allowlist fails closed, and a new
# directory has to be named before it can ship.
#
# uv.lock is deliberately out: 793 KB, and it pins a dev environment rather
# than describing the package's own requirements, which `dependencies` above
# already does. Contributors get it from the repo, which is where `uv sync`
# is run anyway.
#
# `only-include`, not `include`. `include` is a glob filter applied while the
# builder still walks the whole project root, so listing "pyrrhon" there left
# web/, docs/ and evals/ in the tarball anyway; `only-include` is what stops
# the traversal. pyproject.toml, README.md and LICENSE are always included by
# hatchling and need no entry.
#
# One more reason the old denylist could not hold: hatchling honours
# .gitignore, so docs/ was excluded by accident rather than by this list — and
# it started shipping the moment docs/ was commented out of .gitignore so that
# Claude could read it. Nothing here should depend on a .gitignore line that
# exists for an unrelated reason.
[tool.hatch.build.targets.sdist]
only-include = ["pyrrhon", "tests"]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 90
target-version = "py312"

[tool.ruff.lint]
# F  pyflakes (real bugs: unused names, undefined names)
# I  import sorting
# B  bugbear (mutable defaults, except-pass, loop-variable capture)
# ASYNC  blocking calls inside async def — directly relevant to the
#        real-time discipline this codebase documents everywhere
#
# Deliberately small: this repo has never been linted, and a maximal rule set
# would bury real findings under hundreds of style opinions. Widen it in a
# later milestone, not this one.
select = ["F", "I", "B", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
# Channel modules import command packages purely for their registration
# side effect; F401 is the intended shape, already marked with noqa.
#
# repl.py alone, and only because two of its warm-up locals are held solely to
# keep a task alive. tui/app.py used to be listed here too, and the blanket
# ignore silenced the whole file: seventeen dead imports accumulated behind it,
# including the entire core event vocabulary the module stopped touching when
# renderer.py was split out. The registration block carries its own `noqa`, so
# the file needs no exemption of its own.
"pyrrhon/repl.py" = ["F401"]

[tool.mypy]
python_version = "3.12"
# core/ only. The channels lean on Textual/Pipecat types that are not worth
# fighting yet; the headless core is the part with invariants worth pinning.
files = ["pyrrhon/core"]
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# Tool subclasses narrow `run(**kwargs)` to their real named parameters, which
# mypy correctly flags as a Liskov violation. It is the deliberate shape of the
# belt: the typed signature IS the tool's documentation and mirrors its JSON
# `parameters` schema, and tools are only ever invoked by keyword from a
# validated argument object — never through a Tool-typed variable with
# arbitrary kwargs. Silenced here, once, with the reasoning, rather than as
# fourteen scattered `# type: ignore` comments.
module = [
    "pyrrhon.core.tools.*",
    "pyrrhon.core.agent.escalate",
]
disable_error_code = ["override"]
