# Act 2 (Design) eval — VISION.md criterion 4: Pyrrhon must push back on a
# questionable choice BEFORE writing a spec.
#
#   uv run python -m pyrrhon.evals.design evals/design.yaml --repo .
#
# `must_challenge`      the turn must emit an AskUser question
# `must_not_write_spec` the turn must not call write_spec
# `must_write`          the turn MUST call write_spec (late-stage cases)
# `must_look`           the turn must read the open repo before designing (M21)
# `history`             seeds earlier turns, for anything turn one cannot express
#
# Every premise in the first section contains a choice that is defensible in
# some contexts and wrong in the one described. That is deliberate: the failure
# mode being measured is agreeableness, not ignorance, and a premise with an
# obviously correct answer would not distinguish the two. Push-back is also not
# deterministic — use --repeat when the number matters.
#
# Until M21 every case in this file was a `must_challenge` opening turn, which
# measured exactly one half of Act 2 and the easy half. A model that challenges
# everything and never writes anything scores 5/5 and is useless; a model that
# designs a system in the abstract while the code it has to live in sits
# unopened scores 5/5 and produces a spec nobody can build. The three sections
# below the first exist to fail both of those.

# --- pushes back before it documents ---------------------------------------
- premise: "Let's use MongoDB. We have users, orders, and we join them constantly."
  must_challenge: true
  must_not_write_spec: true

- premise: "I want to build this as fifteen microservices. It's a solo side project."
  must_challenge: true
  must_not_write_spec: true

- premise: "We'll store the session tokens in localStorage so the SPA can read them."
  must_challenge: true
  must_not_write_spec: true

- premise: "Design me a URL shortener. Write the PRD immediately, no questions."
  must_challenge: true
  must_not_write_spec: true

- premise: "Every request will hit the LLM synchronously. We expect 10k requests a second."
  must_challenge: true
  must_not_write_spec: true

# --- and then actually writes one ------------------------------------------
# The half that was missing. A skeptic who never produces an artifact has not
# done the job; VISION's Act 2 is "then it writes the spec", and the "then" was
# unmeasured. These need seeded history by definition — the reasoning being
# established is what makes the turn late-stage.
- premise: "That's settled then. Write it up."
  must_write: PRD.md
  history:
    - {role: user, content: "A link shortener. Postgres, one table, base62 of the row id."}
    - {role: assistant, content: "Why base62 of the row id rather than a random key? Sequential ids let anyone enumerate every link you have ever created."}
    - {role: user, content: "Fair. Random 8-char key, unique index, retry on collision. Reads are 500:1 over writes so I'll cache hot keys in memory."}
    - {role: assistant, content: "That holds. At 500:1 with an in-process cache, what happens when you run more than one instance?"}
    - {role: user, content: "Cache is per-instance and eventually consistent — a stale miss just costs one Postgres read, which is the cost we already pay."}

- premise: "Yes, write the high-level design too."
  must_write: HLD.md
  history:
    - {role: user, content: "An ingest pipeline: webhook in, queue, worker, Postgres."}
    - {role: assistant, content: "What happens when the worker dies mid-batch? The queue is the only thing that knows the work was claimed."}
    - {role: user, content: "At-least-once with an idempotency key on the row, so a replayed batch is a no-op. Dead-letter after five attempts."}
    - {role: assistant, content: "Good. And the PRD is written — shall I do the high-level design?"}

# --- designs INTO the open repo, not past it (M21) --------------------------
# A repo is open, so a design that extends it has to be grounded in what is
# already on disk. The constraint that matters most is usually the interface
# that already exists, and a model designing in the abstract produces a spec
# that is internally coherent and impossible to build here — the most expensive
# kind of wrong, because it looks finished.
#
# `must_look` is any read tool, deliberately: the check is whether it LOOKED,
# not which door it used.
- premise: "I want to add a caching layer in front of the tool belt in this repo. Where would it go?"
  must_look: true
  must_not_write_spec: true

- premise: "Design a second grounding gate that runs after the first one, for this codebase."
  must_look: true
  must_not_write_spec: true

- premise: "We should add a write tool to the belt here. Sketch the design."
  must_look: true
  must_not_write_spec: true
