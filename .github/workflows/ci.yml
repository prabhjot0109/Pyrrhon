name: ci

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --all-extras --dev
      - run: uv run ruff check .
      - run: uv run mypy pyrrhon/core
      # No API keys in CI: every test uses a double (tests/helpers.py:FakeLLM),
      # and the grounding eval — which needs a real provider — is run by hand,
      # not here.
      - run: uv run pytest -q
