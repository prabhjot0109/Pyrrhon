name: ci

# web/ is the marketing site (Next.js), deployed by Vercel from its own
# subdirectory. It shares no code with the package, so a copy change should not
# spend a runner on ruff, mypy and 650-odd Python tests.
on:
  push:
    branches: ["**"]
    paths-ignore: ["web/**"]
  pull_request:
    paths-ignore: ["web/**"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # PyAudio ships no manylinux wheel and compiles against portaudio.h, so
      # the runner needs the headers. It used to sit behind the `voice` extra
      # that CI skipped; folding that extra into the base dependencies is what
      # makes this step necessary, and installing the real environment is the
      # point — CI now checks what a user actually gets from `uv sync`.
      - run: sudo apt-get update && sudo apt-get install -y portaudio19-dev
      # Slower than it was: local-smart-turn brings torch. setup-uv's cache
      # carries it between runs, and the alternative is a CI environment no
      # user has.
      - run: uv sync --dev
      - run: uv run ruff check .
      - run: uv run mypy pyrrhon/core
      # No API keys in CI: every test uses a double (tests/helpers.py:FakeLLM),
      # and the grounding eval — which needs a real provider — is run by hand,
      # not here.
      - run: uv run pytest -q
